[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/gemini/status"
  to = "/.netlify/functions/gemini-status"
  status = 200

[[redirects]]
  from = "/api/gemini/generate"
  to = "/.netlify/functions/gemini-generate"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

